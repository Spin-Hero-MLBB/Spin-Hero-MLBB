
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spin Hero MLBB</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* ========================================
           1. PENGATURAN DASAR
        ======================================== */

        :root {
            --bg1: #050B1F;
            --bg2: #0A1A3F;
            --blue: #3B82F6;
            --cyan: #22D3EE;
            --text: #E6EEFF;
            --muted: #8FA6D6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            min-height: 100vh;
            color: var(--text);
            font-family: Inter, system-ui, sans-serif;
            background: radial-gradient(
                ellipse at 50% 0%,
                var(--bg2),
                var(--bg1) 70%
            ) fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 28px 16px 48px;
            overflow-x: hidden;
        }

        #stars,
        #fx {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        #stars {
            z-index: 0;
        }

        #fx {
            z-index: 5;
        }

        main {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            font: 700 clamp(2.2rem, 9vw, 3rem)/1 Rajdhani, sans-serif;
            text-align: center;
            text-shadow:
                0 0 18px rgba(34, 211, 238, .55),
                0 0 42px rgba(59, 130, 246, .45);
        }

        .sub {
            color: var(--muted);
            font-size: .9rem;
            text-align: center;
            margin-top: -10px;
        }

        /* ========================================
           2. CARD
        ======================================== */

        .card {
            width: 100%;
            padding: 18px;
            border-radius: 20px;
            background: rgba(15, 33, 80, .55);
            border: 1px solid rgba(96, 165, 250, .25);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 10px 40px rgba(2, 8, 30, .55);
        }

        .card h2 {
            font: 600 1.15rem Rajdhani, sans-serif;
            margin-bottom: 10px;
            color: #cfe0ff;
        }

        /* ========================================
           3. PILIH ROLE
        ======================================== */

        .roles {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .role {
            padding: 10px 4px;
            border-radius: 14px;
            cursor: pointer;
            color: var(--muted);
            background: rgba(10, 26, 63, .7);
            border: 1px solid rgba(96, 165, 250, .25);
            font: 600 .98rem Rajdhani, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: .15s;
        }

        .role span {
            font-size: 1.4rem;
        }

        .role[aria-pressed="true"] {
            color: var(--text);
            border-color: var(--cyan);
            background: rgba(34, 211, 238, .14);
            box-shadow: 0 0 14px rgba(34, 211, 238, .35);
        }

        .role:disabled {
            opacity: .5;
            cursor: wait;
        }

        /* ========================================
           4. RODA SPIN
        ======================================== */

        .wheel-wrap {
            position: relative;
            width: min(88vw, 380px);
            aspect-ratio: 1;
        }

        .wheel-wrap::before {
            content: "";
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            filter: blur(10px);
            background: radial-gradient(
                circle,
                rgba(34, 211, 238, .28),
                rgba(59, 130, 246, .18) 55%,
                transparent 72%
            );
        }

        #wheel {
            position: relative;
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 50%;
            box-shadow:
                0 0 0 4px #0b1a42,
                0 0 0 6px var(--cyan),
                0 0 36px rgba(34, 211, 238, .45);
        }

        .pointer {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--cyan);
            filter: drop-shadow(0 0 8px var(--cyan));
        }

        #spin {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            width: 24%;
            aspect-ratio: 1;
            border-radius: 50%;
            cursor: pointer;
            font: 700 clamp(1rem, 4.6vw, 1.3rem) Rajdhani, sans-serif;
            color: #031024;
            background: radial-gradient(
                circle at 35% 30%,
                #a5f3fc,
                var(--cyan) 55%,
                var(--blue)
            );
            border: 3px solid #061532;
            box-shadow: 0 0 24px rgba(34, 211, 238, .7);
            transition: transform .15s;
        }

        #spin:hover:not(:disabled) {
            transform: translate(-50%, -50%) scale(1.06);
        }

        #spin:disabled {
            filter: saturate(.3) brightness(.7);
            cursor: not-allowed;
            box-shadow: none;
        }

        :focus-visible {
            outline: 2px solid var(--cyan);
            outline-offset: 3px;
        }

        /* ========================================
           5. HASIL HERO
        ======================================== */

        #result {
            display: flex;
            gap: 16px;
            align-items: center;
            min-height: 120px;
        }

        .portrait {
            flex: none;
            width: 112px;
            height: 112px;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--cyan);
            box-shadow: 0 0 26px rgba(34, 211, 238, .55);
            background: #0a1a3f;
        }

          .portrait img,
            .thumb img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            display: block;
        }

        .fallback {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            font: 700 2.6rem Rajdhani, sans-serif;
            background: linear-gradient(145deg, var(--blue), #1e3a8a);
        }

        .name {
            font: 700 2rem/1 Rajdhani, sans-serif;
            text-shadow: 0 0 14px rgba(34, 211, 238, .5);
        }

        .rolelbl {
            color: var(--cyan);
            font-size: .88rem;
            margin-top: 6px;
        }

        #result p.hint {
            color: var(--muted);
            font-size: .9rem;
        }

        .pop {
            animation: pop .55s cubic-bezier(.2, 1.4, .4, 1);
        }

        @keyframes pop {
            from {
                transform: scale(.85);
                opacity: .1;
            }

            to {
                transform: none;
                opacity: 1;
            }
        }

        /* ========================================
           6. DAFTAR HERO
        ======================================== */

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 230px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .chip {
            padding: 7px 12px;
            border-radius: 999px;
            cursor: pointer;
            font: 500 .84rem Inter, sans-serif;
            color: var(--muted);
            background: rgba(10, 26, 63, .7);
            border: 1px solid rgba(96, 165, 250, .25);
        }

        .chip[aria-pressed="true"] {
            color: var(--text);
            border-color: var(--cyan);
            background: rgba(34, 211, 238, .14);
        }

        .note {
            color: var(--muted);
            font-size: .78rem;
            margin-top: 10px;
        }

        /* ========================================
           7. RIWAYAT
        ======================================== */

        #history {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #history li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            border-radius: 12px;
            background: rgba(10, 26, 63, .6);
            font-size: .9rem;
        }

        .thumb {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            overflow: hidden;
            flex: none;
        }

        .thumb .fallback {
            font-size: 1.1rem;
        }

        #history li em {
            margin-left: auto;
            font-style: normal;
            color: var(--muted);
        }

        #history .empty {
            color: var(--muted);
            justify-content: center;
        }

        @media (prefers-reduced-motion: reduce) {
            .pop {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <canvas id="stars" aria-hidden="true"></canvas>
    <canvas id="fx" aria-hidden="true"></canvas>

    <main>

        <h1>Spin Hero MLBB</h1>
        <p class="sub">Pilih role dulu, lalu putar untuk dapat hero.</p>

        <!-- PILIH ROLE -->
        <section class="card">
            <h2>1. Pilih role</h2>
            <div class="roles" id="roles"></div>
        </section>

        <!-- RODA SPIN -->
        <div class="wheel-wrap">
            <div class="pointer"></div>
            <canvas
                id="wheel"
                width="760"
                height="760"
                aria-label="Roda pilihan hero"
            ></canvas>
            <button id="spin" disabled>SPIN</button>
        </div>

        <!-- HASIL -->
        <section class="card" aria-live="polite">
            <h2>2. Hero kamu</h2>
            <div id="result">
                <p class="hint">
                    Belum ada hasil. Pilih role lalu tekan SPIN.
                </p>
            </div>
        </section>

        <!-- DAFTAR HERO -->
        <section class="card" id="heroCard" hidden>
            <h2>Hero di roda</h2>
            <div class="chips" id="chips"></div>
            <p class="note">
                Tap hero untuk mengeluarkannya dari roda (minimal 2).
            </p>
        </section>

        <!-- RIWAYAT -->
        <section class="card">
            <h2>Riwayat</h2>
            <ul id="history">
                <li class="empty">Belum ada spin.</li>
            </ul>
        </section>

    </main>

    <script>
        /* ========================================
           1. DATA HERO DAN ROLE
        ======================================== */

        const ROLES = {
            Tank: {
                icon: "🛡️",
                color: "#1d4ed8",
                heroes: [
                    "Akai", "Alice", "Atlas", "Barats", "Baxia",
                    "Belerick", "Carmilla", "Chip", "Edith", "Esmeralda",
                    "Franco", "Fredrinn", "Gatotkaca", "Gloo", "Grock",
                    "Hilda", "Hylos", "Johnson", "Khufra", "Lolita",
                    "Marcel", "Masha", "Minotaur", "Tigreal", "Uranus"
                ]
            },

            Fighter: {
                icon: "⚔️",
                color: "#2563eb",
                heroes: [
                    "Aldous", "Alpha", "Alucard", "Argus", "Arlott",
                    "Aulus", "Badang", "Balmond", "Bane", "Barats",
                    "Benedetta", "Chou", "Cici", "Dyrroth", "Fredrinn",
                    "Freya", "Gatotkaca", "Grock", "Guinevere", "Hilda",
                    "Jawhead", "Julian", "Kaja", "Kalea", "Khaleed",
                    "Lapu-Lapu", "Leomord", "Lukas", "Martis", "Masha",
                    "Minsitthar", "Paquito", "Phoveus", "Roger", "Ruby",
                    "Silvanna", "Sora", "Suyou", "Sun", "Terizla",
                    "Thamuz", "X.Borg", "Yin", "Yu Zhong", "Zilong"
                ]
            },

            Assassin: {
                icon: "🗡️",
                color: "#0e7490",
                heroes: [
                    "Aamon", "Alucard", "Arlott", "Benedetta", "Fanny",
                    "Gusion", "Hanzo", "Harley", "Hayabusa", "Helcurt",
                    "Hirara", "Joy", "Kadita", "Karina", "Lancelot",
                    "Lesley", "Ling", "Mathilda", "Natalia", "Nolan",
                    "Paquito", "Saber", "Selena", "Sora", "Suyou",
                    "Yi Sun-shin", "Yin", "Zilong"
                ]
            },

            Mage: {
                icon: "🔮",
                color: "#4338ca",
                heroes: [
                    "Alice", "Aurora", "Bane", "Cecilion", "Chang'e",
                    "Cyclops", "Esmeralda", "Eudora", "Faramis", "Gord",
                    "Harith", "Harley", "Julian", "Kadita", "Kagura",
                    "Kimmy", "Lunox", "Luo Yi", "Lylia", "Nana",
                    "Novaria", "Odette", "Pharsa", "Selena", "Vale",
                    "Valentina", "Valir", "Vexana", "Xavier", "Yve",
                    "Zetian", "Zhask", "Zhuxin"
                ]
            },

            Marksman: {
                icon: "🏹",
                color: "#0369a1",
                heroes: [
                    "Beatrix", "Brody", "Bruno", "Claude", "Clint",
                    "Edith", "Granger", "Hanabi", "Irithel", "Ixia",
                    "Karrie", "Kimmy", "Layla", "Lesley", "Melissa",
                    "Miya", "Moskov", "Natan", "Obsidia",
                    "Popol and Kupa", "Roger", "Wanwan", "Yi Sun-shin"
                ]
            },

            Support: {
                icon: "💚",
                color: "#0f766e",
                heroes: [
                    "Angela", "Carmilla", "Chip", "Diggie", "Estes",
                    "Faramis", "Floryn", "Johnson", "Kaja", "Kalea",
                    "Lolita", "Marcel", "Mathilda", "Minotaur", "Rafaela"
                ]
            }
        };


        
/* ========================================
   2. PENGATURAN GAMBAR HERO
======================================== */

// Folder tempat seluruh gambar hero disimpan
const HERO_FOLDER = "heroes/";

// Pemetaan nama hero ke nama file PNG
const IMAGE_FILE_NAMES = {
    "Chang'e": "chang27e",
    "Luo Yi": "luo_yi",
    "Popol and Kupa": "popol_and_kupa",
    "Yi Sun-shin": "yi_sun-shin",
    "Yu Zhong": "yu_zhong",
    "X.Borg": "xborg",
    "Lapu-Lapu": "lapu-lapu"
};

// Mengubah nama hero menjadi nama file
function imageKey(name) {
    if (IMAGE_FILE_NAMES[name]) {
        return IMAGE_FILE_NAMES[name];
    }

    return name
        .toLowerCase()
        .replace(/['’.]/g, "")
        .replace(/\s+/g, "-");
}

// Membuat alamat gambar
function heroImagePath(name) {
    return HERO_FOLDER + imageKey(name) + ".png";
}

// Jika gambar tidak ditemukan
function imgFail(img) {
    const fallback = document.createElement("div");

    fallback.className = "fallback";
    fallback.textContent = img.alt.charAt(0).toUpperCase();

    img.replaceWith(fallback);
}

// Menampilkan gambar hero
function heroImg(name) {
    return `
        <img
            src="${heroImagePath(name)}"
            alt="${name}"
            loading="lazy"
            onerror="imgFail(this)"
        >
    `;
}


        /* ========================================
           3. PENGATURAN UTAMA
        ======================================== */

        const TAU = Math.PI * 2;
        const $ = selector => document.querySelector(selector);

        const cv = $("#wheel");
        const ctx = cv.getContext("2d");

        let role = null;
        let angle = 0;
        let spinning = false;

        const off = {};

        function pool() {
            if (!role) return [];

            return ROLES[role].heroes.filter(hero => {
                return !(off[role] || new Set()).has(hero);
            });
        }


        /* ========================================
           4. GAMBAR RODA
        ======================================== */

        function draw() {
            const W = cv.width;
            const c = W / 2;
            const R = c - 8;
            const L = pool();
            const n = L.length;

            ctx.clearRect(0, 0, W, W);

            if (!n) {
                const gradient = ctx.createRadialGradient(
                    c, c, 20,
                    c, c, R
                );

                gradient.addColorStop(0, "#0a1a3f");
                gradient.addColorStop(1, "#12286a");

                ctx.beginPath();
                ctx.arc(c, c, R, 0, TAU);
                ctx.fillStyle = gradient;
                ctx.fill();

                ctx.fillStyle = "#8FA6D6";
                ctx.font = "700 52px Rajdhani, sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("Pilih role dulu", c, c - W * .2);

                return;
            }

            const arc = TAU / n;
            const base = ROLES[role].color;

            L.forEach((hero, i) => {
                const a0 = angle + i * arc;

                const gradient = ctx.createRadialGradient(
                    c, c, R * .1,
                    c, c, R
                );

                gradient.addColorStop(0, "#0a1a3f");
                gradient.addColorStop(
                    1,
                    i % 2 ? base : "#1e40af"
                );

                ctx.beginPath();
                ctx.moveTo(c, c);
                ctx.arc(c, c, R, a0, a0 + arc);
                ctx.closePath();

                ctx.fillStyle = gradient;
                ctx.fill();

                ctx.strokeStyle = "rgba(125, 211, 252, .55)";
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();

                ctx.translate(c, c);
                ctx.rotate(a0 + arc / 2);

                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.shadowBlur = n > 12 ? 0 : 8;
                ctx.shadowColor = "rgba(34, 211, 238, .8)";
                ctx.fillStyle = "#E6EEFF";

                const fs =
                    n <= 8 ? 48 :
                    n <= 12 ? 40 :
                    n <= 20 ? 32 :
                    n <= 30 ? 26 : 22;

                ctx.font = `700 ${fs}px Rajdhani, sans-serif`;
                ctx.fillText(hero, R - 26, 0);

                ctx.restore();
            });
        }


        /* ========================================
           5. MEMILIH ROLE
        ======================================== */

        function pickRole(selectedRole) {
            if (spinning) return;

            role = selectedRole;
            angle = 0;

            document.querySelectorAll(".role").forEach(button => {
                button.setAttribute(
                    "aria-pressed",
                    button.dataset.r === selectedRole
                );
            });

            $("#spin").disabled = false;
            $("#heroCard").hidden = false;

            buildChips();
            draw();
        }


        /* ========================================
           6. DAFTAR HERO YANG BISA DIPILIH
        ======================================== */

        function buildChips() {
            const box = $("#chips");
            box.innerHTML = "";

            ROLES[role].heroes.forEach(hero => {
                const removed = off[role] = off[role] || new Set();

                const button = document.createElement("button");

                button.className = "chip";
                button.textContent = hero;

                button.setAttribute(
                    "aria-pressed",
                    !removed.has(hero)
                );

                button.onclick = () => {
                    if (spinning) return;

                    if (removed.has(hero)) {
                        removed.delete(hero);
                    } else {
                        if (pool().length <= 2) return;
                        removed.add(hero);
                    }

                    button.setAttribute(
                        "aria-pressed",
                        !removed.has(hero)
                    );

                    draw();
                };

                box.appendChild(button);
            });
        }


        /* ========================================
           7. MEMBUAT TOMBOL ROLE
        ======================================== */

        const roleBox = $("#roles");

        Object.entries(ROLES).forEach(([name, data]) => {
            const button = document.createElement("button");

            button.className = "role";
            button.dataset.r = name;

            button.setAttribute("aria-pressed", "false");

            button.innerHTML = `
                <span>${data.icon}</span>
                ${name}
            `;

            button.onclick = () => pickRole(name);

            roleBox.appendChild(button);
        });


        /* ========================================
           8. MENAMPILKAN HASIL
        ======================================== */

        const hist = [];

        function show(hero) {
            $("#result").innerHTML = `
                <div class="portrait pop">
                    ${heroImg(hero)}
                </div>

                <div class="pop">
                    <div class="name">${hero}</div>
                    <div class="rolelbl">
                        ${ROLES[role].icon} ${role}
                    </div>
                </div>
            `;

            hist.unshift({
                h: hero,
                role: role
            });

            hist.length = Math.min(hist.length, 5);

            $("#history").innerHTML = hist.map(item => `
                <li>
                    <div class="thumb">
                        ${heroImg(item.h)}
                    </div>

                    ${item.h}

                    <em>${item.role}</em>
                </li>
            `).join("");
        }


        /* ========================================
           9. ANIMASI SPIN
        ======================================== */

        function spin() {
            if (spinning || !role) return;

            const heroes = pool();

            if (heroes.length < 2) return;

            spinning = true;
            $("#spin").disabled = true;

            document.querySelectorAll(".role").forEach(button => {
                button.disabled = true;
            });

            const start = angle;

            const total =
                TAU * (5 + Math.random() * 3) +
                Math.random() * TAU;

            const duration = 5000;
            const startTime = performance.now();

            function step(time) {
                const progress = Math.min(
                    (time - startTime) / duration,
                    1
                );

                angle = start + total * (
                    1 - Math.pow(1 - progress, 4)
                );

                draw();

                if (progress < 1) {
                    requestAnimationFrame(step);
                    return;
                }

                spinning = false;
                $("#spin").disabled = false;

                document.querySelectorAll(".role").forEach(button => {
                    button.disabled = false;
                });

                const currentHeroes = pool();

                const pointerAngle =
                    ((-Math.PI / 2 - angle) % TAU + TAU) % TAU;

                const arc = TAU / currentHeroes.length;

                const winnerIndex = Math.floor(
                    pointerAngle / arc
                );

                show(currentHeroes[winnerIndex]);

                confetti();
            }

            requestAnimationFrame(step);
        }

        $("#spin").onclick = spin;


        /* ========================================
           10. ANIMASI BINTANG
        ======================================== */

        const sc = $("#stars");
        const sx = sc.getContext("2d");

        let stars = [];

        function initStars() {
            sc.width = window.innerWidth;
            sc.height = window.innerHeight;

            stars = Array.from({ length: 70 }, () => ({
                x: Math.random() * sc.width,
                y: Math.random() * sc.height,
                r: Math.random() * 1.4 + .3,
                s: Math.random() * .25 + .05,
                a: Math.random() * 6
            }));
        }

        function tick() {
            sx.clearRect(0, 0, sc.width, sc.height);

            stars.forEach(star => {
                star.a += .01;
                star.y += star.s;

                if (star.y > sc.height) {
                    star.y = 0;
                }

                sx.globalAlpha = .35 + .3 * Math.sin(star.a);
                sx.fillStyle = "#9fd8ff";

                sx.beginPath();
                sx.arc(
                    star.x,
                    star.y,
                    star.r,
                    0,
                    TAU
                );

                sx.fill();
            });

            requestAnimationFrame(tick);
        }

        const calm = window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        ).matches;

        initStars();

        window.addEventListener("resize", initStars);

        if (!calm) {
            tick();
        }


        /* ========================================
           11. EFEK CONFETTI
        ======================================== */

        const fx = $("#fx");
        const fc = fx.getContext("2d");

        function confetti() {
            if (calm) return;

            fx.width = window.innerWidth;
            fx.height = window.innerHeight;

            const colors = [
                "#3B82F6",
                "#22D3EE",
                "#60A5FA",
                "#93C5FD",
                "#E6EEFF"
            ];

            const particles = Array.from(
                { length: 90 },
                () => ({
                    x: fx.width / 2,
                    y: fx.height * .4,
                    vx: (Math.random() - .5) * 11,
                    vy: -Math.random() * 11 - 3,
                    w: Math.random() * 7 + 3,
                    h: Math.random() * 4 + 2,
                    c: colors[Math.random() * colors.length | 0],
                    r: Math.random() * TAU
                })
            );

            let frame = 0;

            function animate() {
                fc.clearRect(0, 0, fx.width, fx.height);

                particles.forEach(particle => {
                    particle.vy += .3;
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.r += .2;

                    fc.save();

                    fc.translate(
                        particle.x,
                        particle.y
                    );

                    fc.rotate(particle.r);

                    fc.fillStyle = particle.c;
                    fc.globalAlpha = Math.max(
                        0,
                        1 - frame / 90
                    );

                    fc.fillRect(
                        -particle.w / 2,
                        -particle.h / 2,
                        particle.w,
                        particle.h
                    );

                    fc.restore();
                });

                frame++;

                if (frame < 90) {
                    requestAnimationFrame(animate);
                } else {
                    fc.clearRect(0, 0, fx.width, fx.height);
                }
            }

            animate();
        }


        /* ========================================
           12. MENJALANKAN APLIKASI
        ======================================== */

        document.fonts.ready.then(draw);

        draw();

    </script>
